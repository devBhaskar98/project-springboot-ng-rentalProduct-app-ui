<mat-drawer-container class="trending-news-container">
  <mat-drawer mode="side" position="end" opened="true" class="trending-news">
    <div class="trending-news-header">
      <h2>Trending news for you</h2>
      <button mat-button (click)="closeSidebar()">Close</button>
    </div>
    <div class="trending-news-content">
      <form [formGroup]="productForm" (ngSubmit)="submitForm()" enctype="multipart/form-data">
        <div>
          <label for="productName">Product Name</label>
          <input id="productName" formControlName="productName" />
        </div>

        <div>
          <label for="productDetails">Product Details</label>
          <textarea id="productDetails" formControlName="productDetails"></textarea>
        </div>

        <div>
          <label for="productImage">Product Image</label>
          <input type="file" id="productImage" (change)="onImageSelected($event)" />
        </div>

        <div *ngIf="imagePreview">
          <p>Image Preview:</p>
          <img [src]="imagePreview" alt="Image preview" style="max-width: 200px" />
        </div>

        <button type="submit">Submit</button>
      </form>
    </div>
  </mat-drawer>
</mat-drawer-container>
